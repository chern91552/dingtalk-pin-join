plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chen91552.dingtalkpinjoin'
    compileSdk 34

    defaultConfig {
        applicationId "com.chen91552.dingtalkpinjoin"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            storeFile file("../pinjoin.keystore")
            storePassword "android"
            keyAlias "pinjoin"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    // 兜底：Maven 仓库不可达时使用本地 jar
    compileOnly files('libs/api-82.jar')
}
