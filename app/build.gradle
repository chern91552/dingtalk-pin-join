import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def releaseSigningConfigured = [
        'pinjoin.storeFile',
        'pinjoin.storePassword',
        'pinjoin.keyAlias',
        'pinjoin.keyPassword',
].every { localProperties.getProperty(it) }

android {
    namespace 'com.chen91552.dingtalkpinjoin'
    compileSdk 34

    defaultConfig {
        applicationId "com.chen91552.dingtalkpinjoin"
        minSdk 24
        targetSdk 34
        versionCode 20
        versionName "3.0.0"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile rootProject.file(localProperties.getProperty('pinjoin.storeFile'))
                storePassword localProperties.getProperty('pinjoin.storePassword')
                keyAlias localProperties.getProperty('pinjoin.keyAlias')
                keyPassword localProperties.getProperty('pinjoin.keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def localXposedApi = file('libs/api-82.jar')
    if (localXposedApi.exists()) {
        compileOnly files(localXposedApi)
    } else {
        compileOnly 'de.robv.android.xposed:api:82'
    }
}
